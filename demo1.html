<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <time datetime=""></time>
    <title> css grid layout</title>
    <style>

        body {
            font-family:sans-serif ;

        }

        .container > div {

            border-radius: 5px;
            padding: 10px;
            background-color:rgb(207 232 220 );
            border: 2px solid rgb(79 185 227 );
        }
        /*creando grid flexible utlilizando  unidades fr, es decir indicando cuantas  fracciones 
        del esoacio disponible se requiere para cada colomna . porejemplo:
         acontinuacion queremos que cada columna tome una fraccion del espacio disponible */

         /* Que la primera columna ocupe 2 fracciones del espacio disponible */

.container {
     display: grid;
    grid-template-columns:2fr 1fr 1fr;
    gap: 20px;
    



}

    </style>


</head>

<body>
    <div class="container">
        <div>one</div>
        <div>Tow</div>
        <div>Three</div>
        <div>four</div>
        <div>Five</div>
        <div>Six</div>
        <div>Seven</div>
    </div>
</body>
</body>

</html>
