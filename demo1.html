<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <time datetime=""></time>
    <title> css grid layout</title>
    <style>

        body {
            font-family:sans-serif ;

        }

        .container > div {

            border-radius: 5px;
            padding: 10px;
            background-color:rgb(207 232 220 );
            border: 2px solid rgb(79 185 227 );
        }

.container{
    display: grid;
    grid-template-columns:200px 200px 200px ;

    


}

    </style>


</head>

<body>
    <div class="container">
        <div>one</div>
        <div>Tow</div>
        <div>Three</div>
        <div>four</div>
        <div>Five</div>
        <div>Six</div>
        <div>Seven</div>
    </div>
</body>
</body>

</html>
