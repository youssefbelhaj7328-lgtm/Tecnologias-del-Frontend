<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intro al HTML</title>
    <style>
        #contenido {
            margin: 0 auto;
            width: 80%;
            height: 600px;
            background-color: aquamarine;
            border: 2px solid red;
        }

        #cabecera {
            width: 100%;
            height: 50px;
            background-color: brown;
            color: white;
            align-items: center;
            text-align: center;
        }

        #headerCabecera {
            margin-top: 0px;
        } 
        #menuLateral {

            width: 30%;
            background-color: coral;
            color: white;
            height: 500px;
            float: left;





        }
        #areaContenido{
width: 70%;
height:500px;
background-color: darkolivegreen; 
color: white;
float: left;
#footer{
    width: 100%;
    height: 50px;
    background-color: black;
    color: white;
    text-align:center;
    align-items: center;
    clear: both;
    
}


        }
    </style>
</head>

<body>
    <h1>Uso de la propiedad float, en sus inicios</h1>
    <div id="contenido">
        <div id="cabecera">
            <h1 id="headerCabecera">Cabecera de la pagina</h1>
        </div>
        <div id="menuLateral">
            Menu lateral
        </div>
        <div id="areaContenido">
            Area de Contenidos
        </div>
        <div id="footer">
            Pie de Pagina (Footer)
        </div>
    </div>


</body>

</html>
