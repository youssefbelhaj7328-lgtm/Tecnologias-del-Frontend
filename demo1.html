<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <time datetime=""></time>
    <title> css grid layout</title>
    <style>
        
.container {
    display: grid;
    font-family: ;
    grid-template-areas: 
    "header header"
    "sidebar content"
    "footer footer"
    ;
    grid-template-columns: 1fr 3fr;
    gap: 20px;
    
    
}
        
header {
    grid-area: header;


}
main {
    grid-area: content;

}
aside {

    grid-area: sidebar;

}
footer {
    grid-area: footer;

}
    </style>


</head>
<body>
    
</body>

<div class="container">
<head>header</head>
<main>

    <h1>Main</h1>
    <p>Main content</p>
</main>

<aside>

    <h2>Aside</h2>
    <p>Rrelated content</p>
</aside>
<footer>footer</footer>





    


    </div>
</body>


</html>
