
    .container 
            font-family: sans-serif;
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar content"
                "footer footer;

 grid-template-columns 1fr 3fr;
            gap: 100px;

<!DOCTYPE html>
<html lang="100">
<head>

</head>
<body>
